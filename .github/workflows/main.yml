name: Deploy to GitHub Pages

on:
  push:
    branches: ['main'] # или 'master'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Устанавливаем pnpm ПЕРЕД setup-node
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # или нужная вам версия pnpm

      # 2. Настраиваем Node.js и включаем кэш для pnpm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 3. Устанавливаем зависимости через pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Сборка проекта
      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4